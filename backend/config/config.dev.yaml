# DocFlow - Development configuration
# Inherits from config.default.yaml and overrides development-specific values

server:
  port: "8082"
  host: "0.0.0.0"
  tls_cert_path: ""
  tls_key_path: ""

session:
  timeout: 24h
  cleanup_interval: 10m
  max_failed_attempts: 3
  lockout_duration: 1m

upload:
  max_file_size_mb: 50
  allowed_types:
    - "image/jpeg"
    - "image/png"
    - "image/webp"
    - "image/gif"

pdf:
  max_pages: 30
  jpeg_quality: 90
  compress_output: true

websocket:
  read_deadline: 120s
  ping_interval: 60s
  allowed_origins:
    - "https://localhost:8082"
    - "http://localhost:8082"
    - "https://127.0.0.1:8082"
    - "http://127.0.0.1:8082"
    - "https://localhost:3000"
    - "http://localhost:3000"
    - "https://127.0.0.1:3000"
    - "http://127.0.0.1:3000"
    - "http://0.0.0.0:8082"
    - "http://0.0.0.0:3000"
  allow_private_ips: true

logging:
  level: "debug"
  format: "text"

rate_limit:
  enabled: true
  max_requests: 1000
  window_seconds: 60
