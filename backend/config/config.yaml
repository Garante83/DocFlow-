# DocFlow - Default configuration
# This file contains the default values for all environments

server:
  port: "8082"
  host: "0.0.0.0"
  tls_cert_path: ""
  tls_key_path: ""

session:
  timeout: 1h
  cleanup_interval: 5m
  max_failed_attempts: 3
  lockout_duration: 5m

upload:
  max_file_size_mb: 10
  allowed_types:
    - "image/jpeg"
    - "image/png"
    - "image/webp"

pdf:
  max_pages: 20
  jpeg_quality: 85
  compress_output: true

websocket:
  read_deadline: 60s
  ping_interval: 30s
  allowed_origins:
    - "https://localhost:8082"
    - "http://localhost:8082"
    - "https://127.0.0.1:8082"
    - "http://127.0.0.1:8082"
  allow_private_ips: true

logging:
  level: "info"
  format: "json"

rate_limit:
  enabled: true
  max_requests: 100
  window_seconds: 60
