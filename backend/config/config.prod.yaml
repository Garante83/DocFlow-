# DocFlow - Production configuration
# Inherits from config.default.yaml and overrides production-specific values

server:
  port: "443"
  host: "0.0.0.0"
  tls_cert_path: "/etc/letsencrypt/live/docflow/fullchain.pem"
  tls_key_path: "/etc/letsencrypt/live/docflow/privkey.pem"

session:
  timeout: 1h
  cleanup_interval: 5m
  max_failed_attempts: 3
  lockout_duration: 15m

upload:
  max_file_size_mb: 10
  allowed_types:
    - "image/jpeg"
    - "image/png"

pdf:
  max_pages: 20
  jpeg_quality: 85
  compress_output: true

websocket:
  read_deadline: 30s
  ping_interval: 15s
  allowed_origins:
    - "https://docflow.example.com"
  allow_private_ips: false

logging:
  level: "info"
  format: "json"

rate_limit:
  enabled: true
  max_requests: 60
  window_seconds: 60
